# Keys only. /etc/cdsimage/authorized_keys is mounted read-only by `cdsimage up`
# (CDS_AUTHORIZED_KEYS), so every instance accepts the same keys and nothing
# has to be copied in after a reset. Read through a command rather than
# AuthorizedKeysFile: a bind-mounted file keeps the host's owner and mode, which
# StrictModes rejects, and this way an edit on the host applies at once.
AuthorizedKeysCommand /usr/bin/cat /etc/cdsimage/authorized_keys
AuthorizedKeysCommandUser nobody
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# per-instance host key, kept outside the container so a reset does not change
# it and clients don't see a "host key changed" warning
HostKey /etc/ssh/hostkeys/ssh_host_ed25519_key
